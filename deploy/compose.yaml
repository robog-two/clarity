# Clarity: single-tenant stack for Podman (rootless works).
#
#   ./deploy/init-secrets.sh
#   podman compose -f deploy/compose.yaml up -d                      # postgres + backend + egress proxy + caddy (TLS) + render (reports)
#   podman compose -f deploy/compose.yaml --profile example up -d    # + example connector
#   podman compose -f deploy/compose.yaml --profile mail --profile dav up -d   # + email (IMAP/SMTP), calendar/contacts/files (DAV)
#   podman compose -f deploy/compose.yaml --profile computers up -d  # + sandbox and Firefox browser (agent tools)
#
# Settings come from deploy/.env (copy .env.example; pass --env-file deploy/.env).
name: clarity

x-hardening: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  # no noexec: JVM libraries (e.g. jansi) extract native code to /tmp
  tmpfs: ["/tmp:rw,nosuid,size=64m"]

services:
  postgres:
    <<: *hardened
    image: docker.io/library/postgres:18-alpine
    # Run as the image's postgres user (uid 70) so no capabilities are needed for gosu/chown.
    user: "70:70"
    environment:
      POSTGRES_DB: clarity
      POSTGRES_USER: clarity
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      # PostgreSQL 18+ images keep the cluster in a versioned subdirectory of /var/lib/postgresql
      # (not /var/lib/postgresql/data), so mount the parent.
      - pgdata:/var/lib/postgresql
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /run/postgresql:rw,noexec,nosuid,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clarity -d clarity -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [db]
    mem_limit: 512m
    cpus: 1.0

  backend:
    <<: *hardened
    image: ghcr.io/robog-two/clarity-backend:${CLARITY_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/container/jvm-app.Containerfile
      args:
        MODULE: backend
        APP_NAME: clarity-backend
        MODULE_DIR: backend
    user: "10001:10001"
    ports:
      # Loopback by default. Put a TLS reverse proxy in front before binding anything else.
      - "${CLARITY_BIND:-127.0.0.1}:8080:8080"
    environment:
      CLARITY_HTTP_PORT: "8080"
      CLARITY_DB_URL: jdbc:postgresql://postgres:5432/clarity
      CLARITY_DB_USER: clarity
      CLARITY_DB_PASSWORD_FILE: /run/secrets/postgres_password
      CLARITY_DATA_DIR: /data
      CLARITY_SECRETS_DIR: /run/secrets
      CLARITY_ENROLLMENT_MODE: ${CLARITY_ENROLLMENT_MODE:-tofu}
      CLARITY_CONNECTORS_AUTO_GRANT: ${CLARITY_CONNECTORS_AUTO_GRANT:-false}
      # The model API (OpenRouter) is reached only through the egress proxy (openrouter.ai is all it allows).
      CLARITY_HTTPS_PROXY: http://egress:3128
      # Legacy lead model/effort (blank = the backend default); CLARITY_AGENT_LEAD_MODEL wins.
      CLARITY_AGENT_MODEL: ${CLARITY_AGENT_MODEL:-}
      CLARITY_AGENT_EFFORT: ${CLARITY_AGENT_EFFORT:-medium}
      # OpenRouter runs every model and the backend does not start without its key: the
      # openrouter_api_key secret (deploy/init-secrets.sh), or OPENROUTER_API_KEY in deploy/.env.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_API_KEY_FILE: ${OPENROUTER_API_KEY_FILE:-/run/secrets/openrouter_api_key}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}   # blank = https://openrouter.ai/api/v1 (e2e points it at a closed port)
      # Routing: zero data retention, no fp4/int4 endpoints, cheapest first; ORDER pins providers so the prompt cache stays warm.
      # Defaults repeat the backend's: a blank QUANTIZATIONS/SORT would mean "any" there.
      OPENROUTER_ZDR: ${OPENROUTER_ZDR:-true}
      OPENROUTER_QUANTIZATIONS: ${OPENROUTER_QUANTIZATIONS:-fp8,bf16,fp16}
      OPENROUTER_SORT: ${OPENROUTER_SORT:-price}
      OPENROUTER_PROVIDER_ORDER: ${OPENROUTER_PROVIDER_ORDER:-}
      OPENROUTER_ALLOW_FALLBACKS: ${OPENROUTER_ALLOW_FALLBACKS:-}
      # Per-role OpenRouter model ids (e.g. anthropic/claude-opus-5.5); blank keeps the backend default.
      CLARITY_AGENT_LEAD_MODEL: ${CLARITY_AGENT_LEAD_MODEL:-}
      CLARITY_AGENT_HELPER_MODEL: ${CLARITY_AGENT_HELPER_MODEL:-}
      CLARITY_AGENT_GUARD_MODEL: ${CLARITY_AGENT_GUARD_MODEL:-}
      CLARITY_AGENT_TRIAGE_MODEL: ${CLARITY_AGENT_TRIAGE_MODEL:-}
      # Step limits: the lead's turns, and a helper's (browsing takes many small steps).
      CLARITY_AGENT_MAX_TURNS: ${CLARITY_AGENT_MAX_TURNS:-30}
      CLARITY_AGENT_HELPER_MAX_TURNS: ${CLARITY_AGENT_HELPER_MAX_TURNS:-60}
      # Semantic memory search: embeddings through OpenRouter (on whenever it has a key; false = full-text only).
      CLARITY_MEMORY_EMBEDDINGS: ${CLARITY_MEMORY_EMBEDDINGS:-}
      CLARITY_MEMORY_EMBEDDINGS_MODEL: ${CLARITY_MEMORY_EMBEDDINGS_MODEL:-}
      CLARITY_REVIEW_INTERVAL: ${CLARITY_REVIEW_INTERVAL:-2h}
      # Review gate: before each periodic review a decision model (OpenRouter, on whenever it has a key)
      # judges whether what changed needs the lead now; any error wakes the lead. Blank = default.
      CLARITY_DECISIONS: ${CLARITY_DECISIONS:-}
      CLARITY_DECISION_MODEL: ${CLARITY_DECISION_MODEL:-}
      CLARITY_REVIEW_GATE: ${CLARITY_REVIEW_GATE:-}
      CLARITY_REVIEW_GATE_THRESHOLD: ${CLARITY_REVIEW_GATE_THRESHOLD:-}
      CLARITY_REVIEW_MAX_QUIET: ${CLARITY_REVIEW_MAX_QUIET:-}
      # With the `computers` profile:
      #   sandbox=http://sandbox:8940/mcp;keyFile=/run/secrets/sandbox_key,browser=http://browser:8931/mcp;keyFile=/run/secrets/browser_key
      CLARITY_MCP_SERVERS: ${CLARITY_MCP_SERVERS:-}
      # Reports: the render service (pandoc + Typst) on the internal `render` network, and the size cap
      # of the rendered-file cache under /data/reports (rebuildable; revisions are never swept).
      CLARITY_RENDER_URL: http://render:8950
      CLARITY_RENDER_KEY_FILE: /run/secrets/render_key
      CLARITY_RENDER_TIMEOUT: ${CLARITY_RENDER_TIMEOUT:-60s}
      CLARITY_REPORTS_CACHE_MAX_MB: ${CLARITY_REPORTS_CACHE_MAX_MB:-500}
      # Web search for helpers the lead grants it (OpenRouter's openrouter:web_search; never the lead). Blank = default.
      CLARITY_WEB_SEARCH: ${CLARITY_WEB_SEARCH:-}
      CLARITY_WEB_SEARCH_ENGINE: ${CLARITY_WEB_SEARCH_ENGINE:-}
      CLARITY_WEB_SEARCH_MAX_SEARCHES: ${CLARITY_WEB_SEARCH_MAX_SEARCHES:-}
      CLARITY_WEB_SEARCH_EXCLUDED_DOMAINS: ${CLARITY_WEB_SEARCH_EXCLUDED_DOMAINS:-}
    # The backend registers every /run/secrets/connector_<id>_key as a provisioned connector,
    # so each connector's key secret is mounted here AND into that connector.
    secrets:
      - postgres_password
      - openrouter_api_key   # required: every model runs on OpenRouter
      - connector_example_key
      - connector_mail_key
      - connector_dav_key
      - sandbox_key      # bearer keys for the `computers` profile (CLARITY_MCP_SERVERS keyFile=...)
      - browser_key
      - render_key       # bearer key for the render service
    volumes:
      - backend-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      egress:
        condition: service_healthy
    healthcheck:
      # busybox wget ships with the alpine JRE image
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    networks: [db, ingest, tools, proxy, backend-proxy, render]
    mem_limit: 1g
    cpus: 2.0

  caddy:
    <<: *hardened
    # TLS terminator: provisions and renews its own certificates (see deploy/caddy/Caddyfile).
    image: docker.io/library/caddy:2-alpine
    # Root *inside* the container (an unprivileged user on the host when rootless) so it can bind
    # :80/:443; every capability but NET_BIND_SERVICE is dropped.
    cap_add: [NET_BIND_SERVICE]
    ports:
      # Rootless Podman cannot publish ports < 1024 by default:
      #   sudo sysctl -w net.ipv4.ip_unprivileged_port_start=80
      # CLARITY_PUBLIC_BIND picks the address family: 0.0.0.0 = IPv4 only, [::] = IPv6, or a specific address.
      # or set CLARITY_HTTP_PORT / CLARITY_HTTPS_PORT (ACME needs 80/443 to be reachable from the internet).
      - "${CLARITY_PUBLIC_BIND:-[::]}:${CLARITY_HTTP_PORT:-80}:80"
      - "${CLARITY_PUBLIC_BIND:-[::]}:${CLARITY_HTTPS_PORT:-443}:443"
      - "${CLARITY_PUBLIC_BIND:-[::]}:${CLARITY_HTTPS_PORT:-443}:443/udp"
    environment:
      CLARITY_DOMAIN: ${CLARITY_DOMAIN:-localhost}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro,z
      - ./secrets/tls:/etc/caddy/certs:ro,z   # your own certificates, if any (see the Caddyfile)
      - caddy-data:/data       # certificates, ACME account, local CA root
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
    networks: [proxy, caddy-egress]
    mem_limit: 256m
    cpus: 0.5

  egress:
    <<: *hardened
    # Squid, the single door to the internet for the browser, the sandbox and the backend
    # (computers/egress). Public hosts only for the browser and the sandbox; openrouter.ai only
    # for the backend. Each client
    # network gets its own listener, bound to this container's address on it (hence the aliases).
    image: ghcr.io/robog-two/clarity-egress:${CLARITY_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/container/egress.Containerfile
    user: "10001:10001"
    environment:
      # Extra hosts the backend may reach (comma separated), e.g. a self-hosted model gateway.
      CLARITY_BACKEND_EGRESS_ALLOW: ${CLARITY_BACKEND_EGRESS_ALLOW:-}
    healthcheck:
      # a real proxy request to the loopback health listener (a bare TCP connect spams the access log)
      test: ["CMD", "/usr/local/bin/egress-health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      browser-proxy: { aliases: [egress-browser] }
      backend-proxy: { aliases: [egress-backend] }
      sandbox-proxy: { aliases: [egress-sandbox] }
      egress: {}
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64

  connector-example:
    <<: *hardened
    profiles: [example]
    image: ghcr.io/robog-two/clarity-connector-example:${CLARITY_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/container/jvm-app.Containerfile
      args:
        MODULE: connectors:example
        APP_NAME: clarity-connector-example
        MODULE_DIR: connectors/example
    user: "10001:10001"
    environment:
      CLARITY_URL: http://backend:8080
      CLARITY_CONNECTOR_KEY_FILE: /run/secrets/connector_example_key
      CLARITY_SYNC_INTERVAL: ${CLARITY_EXAMPLE_SYNC_INTERVAL:-1m}
      CLARITY_STATE_DIR: /data
    secrets:
      - connector_example_key
    volumes:
      - connector-example-data:/data
    depends_on:
      backend:
        condition: service_healthy
    # ingest = reach the backend only; its own egress network = reach its upstream (none for the sample).
    networks: [ingest, connector-example-egress]
    mem_limit: 256m
    cpus: 0.5

  connector-mail:
    <<: *hardened
    profiles: [mail]
    image: ghcr.io/robog-two/clarity-connector-mail:${CLARITY_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/container/jvm-app.Containerfile
      args:
        MODULE: connectors:mail
        APP_NAME: clarity-connector-mail
        MODULE_DIR: connectors/mail
    user: "10001:10001"
    environment:
      CLARITY_URL: http://backend:8080
      CLARITY_CONNECTOR_KEY_FILE: /run/secrets/connector_mail_key
      CLARITY_CONNECTOR_ID: mail
      CLARITY_SYNC_INTERVAL: ${CLARITY_MAIL_SYNC_INTERVAL:-30s}
      CLARITY_STATE_DIR: /data
    secrets:
      - connector_mail_key
    volumes:
      - connector-mail-data:/data
    depends_on:
      backend:
        condition: service_healthy
    # ingest = reach the backend only; its own egress network = reach the mail servers.
    networks: [ingest, connector-mail-egress]
    mem_limit: 384m
    cpus: 0.5

  connector-dav:
    <<: *hardened
    profiles: [dav]
    image: ghcr.io/robog-two/clarity-connector-dav:${CLARITY_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/container/jvm-app.Containerfile
      args:
        MODULE: connectors:dav
        APP_NAME: clarity-connector-dav
        MODULE_DIR: connectors/dav
    user: "10001:10001"
    environment:
      CLARITY_URL: http://backend:8080
      CLARITY_CONNECTOR_KEY_FILE: /run/secrets/connector_dav_key
      CLARITY_CONNECTOR_ID: dav
      CLARITY_SYNC_INTERVAL: ${CLARITY_DAV_SYNC_INTERVAL:-5m}
      CLARITY_STATE_DIR: /data
    secrets:
      - connector_dav_key
    volumes:
      - connector-dav-data:/data
    depends_on:
      backend:
        condition: service_healthy
    # ingest = reach the backend only; its own egress network = reach the calendar, contacts and file server.
    networks: [ingest, connector-dav-egress]
    mem_limit: 512m
    cpus: 0.5

  render:
    <<: *hardened
    # renderd: report revisions (Markdown + style) to PDF, Word, OpenDocument and plain text with pandoc
    # and Typst (computers/render). Only on the internal `render` network: it reaches nothing, and only
    # the backend reaches it. Stateless; the backend caches what it renders.
    image: ghcr.io/robog-two/clarity-render:${CLARITY_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/container/render.Containerfile
    user: "10001:10001"
    environment:
      RENDER_PORT: "8950"
      RENDER_KEY_FILE: /run/secrets/render_key
      # Seconds per render; the backend waits a little longer (CLARITY_RENDER_TIMEOUT).
      RENDER_TIMEOUT: "60"
    secrets:
      - render_key
    tmpfs:
      - /tmp:rw,nosuid,size=256m   # each render's working files, deleted after it
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8950/healthz', timeout=2).status == 200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks: [render]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128

  sandbox:
    <<: *hardened
    profiles: [computers]
    # sandboxd: the agent's Linux workspace as an MCP server (computers/sandbox). On the internal
    # `tools` network, and on `sandbox-proxy` to reach public websites through the egress proxy
    # (never the LAN). No route to Postgres or the connectors.
    image: ghcr.io/robog-two/clarity-sandbox:${CLARITY_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/container/sandbox.Containerfile
    user: "10001:10001"
    environment:
      SANDBOX_PORT: "8940"
      SANDBOX_WORKSPACE: /workspace
      SANDBOX_KEY_FILE: /run/secrets/sandbox_key
      # Remove to take the sandbox offline (then also drop sandbox-proxy below).
      SANDBOX_HTTP_PROXY: http://egress-sandbox:3128
    secrets:
      - sandbox_key
    volumes:
      - sandbox-workspace:/workspace   # the only thing that persists; the container is disposable
      - browser-downloads:/workspace/downloads:ro   # what the browser downloads, read-only here
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8940 && printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ok <&3"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    networks: [tools, sandbox-proxy]
    depends_on:
      egress: { condition: service_healthy }
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 512

  browser:
    <<: *hardened
    profiles: [computers]
    # Headless Firefox ESR + uBlock Origin + Privacy Badger, driven by Mozilla's Firefox DevTools
    # MCP server, served as streamable HTTP on :8931/mcp (computers/browser). It reaches the public
    # internet only through the `egress` proxy (never the LAN) and the backend through `tools`.
    image: ghcr.io/robog-two/clarity-browser:${CLARITY_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/container/browser.Containerfile
    user: "10001:10001"
    # Firefox's own content sandbox chroots; this one capability (inside the container's user
    # namespace) keeps it enabled instead of disabling the sandbox.
    cap_add: [SYS_CHROOT]
    environment:
      BROWSER_PORT: "8931"
      BROWSER_KEY_FILE: /run/secrets/browser_key
      # Cookies and site logins are kept between restarts (a deploy, a crash), so a sign-in the
      # person approved survives them. Saved passwords and form data are never kept (user.js).
      BROWSER_PROFILE_DIR: /profile
    secrets:
      - browser_key
    # The profile lives on a volume; HOME on tmpfs. Downloads go to a volume the sandbox reads;
    # files older than BROWSER_DOWNLOADS_DAYS (7) are deleted at start.
    volumes:
      - browser-profile:/profile
      - browser-downloads:/downloads
    tmpfs:
      - /tmp:rw,nosuid,size=768m
    shm_size: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8931/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    networks: [tools, browser-proxy]
    mem_limit: 1536m
    cpus: 2.0
    pids_limit: 1024

networks:
  # Internal networks have no route off the host, which is the point:
  db:       { internal: true }   # postgres <-> backend
  ingest:   { internal: true }   # backend <-> connectors
  tools:    { internal: true }   # backend <-> MCP tool containers
  render:   { internal: true }   # backend <-> render (pandoc); the renderer reaches nothing else
  proxy:    { internal: true }   # caddy <-> backend
  # The proxy's client networks: browser, sandbox and backend, each <-> egress.
  browser-proxy: { internal: true }
  sandbox-proxy: { internal: true }
  backend-proxy: { internal: true }
  # The only route out for the browser, the sandbox and the backend, and only `egress` is on it.
  egress: { enable_ipv6: true }
  # One egress network per remaining service that needs the internet (connectors usually talk to
  # servers on your LAN), so connectors cannot reach each other.
  caddy-egress: { enable_ipv6: true }   # ACME (certificate issuance/renewal), v4 or v6
  connector-example-egress: {}
  connector-mail-egress: {}
  connector-dav-egress: {}

secrets:
  # Created by deploy/init-secrets.sh (`podman secret create <name>`; podman-compose mounts them at /run/secrets/<name>).
  postgres_password:
    external: true
  openrouter_api_key:

    external: true
  connector_example_key:
    external: true
  connector_mail_key:
    external: true
  connector_dav_key:
    external: true
  sandbox_key:
    external: true
  browser_key:
    external: true
  render_key:
    external: true

volumes:
  pgdata:
  backend-data:
  caddy-data:
  caddy-config:
  connector-example-data:
  connector-mail-data:
  connector-dav-data:
  sandbox-workspace:
  browser-downloads:
  browser-profile:
