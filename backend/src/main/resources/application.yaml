# Defaults. Every value can be overridden by the environment variable named in config/ConfigLoading.kt.
clarity:
  instance:
    name: Clarity
  http:
    port: 8080
  database:
    url: jdbc:postgresql://localhost:5432/clarity
    user: clarity
    maxPoolSize: 10
  dataDir: ./data
  enrollment:
    mode: tofu
  connectors:
    autoGrant: false
    secretsDir: /run/secrets
  agent:
    # Per-role model settings; every model runs on OpenRouter (OPENROUTER_API_KEY or OPENROUTER_API_KEY_FILE
    # is required) and is named by its OpenRouter id (Claude: anthropic/claude-opus-5.5).
    # CLARITY_AGENT_<ROLE>_MODEL / _EFFORT / _MAX_TOKENS / _CACHE_TTL / _COMPACTION / _COMPACT_AT_TOKENS
    # override these; the legacy CLARITY_AGENT_MODEL / CLARITY_AGENT_EFFORT set the lead's. The lead compacts
    # its thread client-side at compactAtTokens. cacheTtl applies to models that cache at explicit
    # breakpoints (Claude); the others cache on their own.
    # OpenRouter routing: OPENROUTER_ZDR (default true: zero data retention endpoints only),
    # OPENROUTER_QUANTIZATIONS (default fp8,bf16,fp16; blank: any) and OPENROUTER_SORT (default price;
    # blank: OpenRouter's balancing), or agent.openRouter.zdr / quantizations / sort here.
    # These are the defaults: the app's Settings can override model and effort per role at runtime.
    roles:
      lead:
        model: xiaomi/mimo-v2.6-pro
        effort: medium
        maxTokens: 64000
        cacheTtl: 1h
        compaction: true
      helper:
        model: deepseek/deepseek-v4.1-flash-1017
        effort: medium
        maxTokens: 32000
        cacheTtl: 5m
        compaction: false
      guard:
        model: deepseek/deepseek-v4.1-flash-1017
        effort: low
        maxTokens: 4000
        cacheTtl: 5m
        compaction: false
      triage:
        model: deepseek/deepseek-v4.1-flash-1017
        effort: low
        maxTokens: 4000
        cacheTtl: 5m
        compaction: false
    reviewInterval: 2h
    maxTurns: 30
    helperMaxTurns: 60
    maxConcurrentRuns: 2
    mcpServers: ""
    openRouterBaseUrl: https://openrouter.ai/api/v1
