# Defaults. Every value can be overridden by the environment variable named in config/ConfigLoading.kt.
clarity:
  instance:
    name: Clarity
  http:
    port: 8080
  database:
    url: jdbc:postgresql://localhost:5432/clarity
    user: clarity
    maxPoolSize: 10
  dataDir: ./data
  enrollment:
    mode: tofu
  connectors:
    autoGrant: false
    secretsDir: /run/secrets
  agent:
    # Per-role model settings. CLARITY_AGENT_<ROLE>_PROVIDER / _MODEL / _EFFORT / _MAX_TOKENS / _CACHE_TTL /
    # _COMPACTION override these; the legacy CLARITY_AGENT_MODEL / CLARITY_AGENT_EFFORT set the lead's.
    # provider: anthropic or openrouter (OPENROUTER_API_KEY; model names are OpenRouter's then, e.g.
    # anthropic/claude-haiku-5.5). OpenRouter has no server-side compaction, so keep the lead on anthropic.
    roles:
      lead:
        provider: anthropic
        model: claude-opus-5-5
        effort: medium
        maxTokens: 64000
        cacheTtl: 1h
        compaction: true
      helper:
        provider: anthropic
        model: claude-sonnet-5-5
        effort: medium
        maxTokens: 32000
        cacheTtl: 5m
        compaction: false
      guard:
        provider: anthropic
        model: claude-haiku-5-5
        effort: low
        maxTokens: 4000
        cacheTtl: 5m
        compaction: false
      triage:
        provider: anthropic
        model: claude-haiku-5-5
        effort: low
        maxTokens: 4000
        cacheTtl: 5m
        compaction: false
    reviewInterval: 2h
    maxTurns: 30
    maxConcurrentRuns: 2
    mcpServers: ""
    openRouterBaseUrl: https://openrouter.ai/api/v1
