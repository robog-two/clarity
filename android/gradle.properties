org.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
# Screenshot previews live in app/src/screenshotTest: ./gradlew :app:updateDebugScreenshotTest renders them.
android.experimental.enableScreenshotTest=true
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
