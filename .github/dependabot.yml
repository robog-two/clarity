version: 2
# Security updates only. Every ecosystem has open-pull-requests-limit: 0, which turns off routine
# version-update PRs; Dependabot security updates (enabled in the repo settings) still open PRs for
# known vulnerabilities and use the groups below. Security PRs target the default branch (main).
updates:
  - package-ecosystem: gradle
    directories: ["/", "/android"]
    target-branch: dev
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
    groups:
      gradle-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: "/deploy/container"
    target-branch: dev
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
    groups:
      docker-minor-patch:
        update-types: [minor, patch]

  # Images referenced from the compose file (postgres, caddy).
  - package-ecosystem: docker-compose
    directory: "/deploy"
    target-branch: dev
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
    groups:
      compose-minor-patch:
        update-types: [minor, patch]

  # Pinned npm tree of the browser container (Firefox DevTools MCP + supergateway).
  - package-ecosystem: npm
    directory: "/computers/browser"
    target-branch: dev
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
