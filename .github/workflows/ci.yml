name: CI

# Two jobs per run. Pushes to dev and PRs from other branches (Dependabot, feature branches) are
# tested; a PR from dev is skipped because the same commits were already tested on the push to
# dev, and main is not re-tested (it only receives tested dev commits; see android-release.yml).
on:
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]
  push:
    branches: [dev]
    paths-ignore: ["**/*.md", "docs/**"]

permissions:
  contents: read

# A newer push or PR update cancels the run it supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (JVM and Android)
    if: github.event_name == 'push' || github.head_ref != 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: JVM build and tests
        run: ./gradlew build --no-daemon --console=plain
      - name: Ensure Android platform 37.0 (compileSdk 37, minor 0)
        run: |
          set -eu
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          sdkmanager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -d "$sdk/platforms/android-37.0" ]; then
            yes | "$sdkmanager" --licenses >/dev/null || true
            "$sdkmanager" "platforms;android-37.0"
          fi
      - name: Android build, lint and unit tests
        working-directory: android
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: clarity-debug-apk
          path: android/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  # One job for everything that runs containers, so each image is built once:
  #  - sandbox and browser smoke tests: Firefox starts headless, both add-ons are active, MCP
  #    tools/list works, a snapshot of a local page returns element uids;
  #  - egress smoke test: public HTTPS works; private, loopback, link-local, ULA and DNS-to-private
  #    destinations and non-443 CONNECT are refused; the backend listener allows only the model API;
  #    Firefox works through the proxy;
  #  - the whole compose stack (e2e/run.sh, reusing the images above): enrolls a device, drives the
  #    app API, ingests through the example connector, reads the feed over SSE, checks the sandbox
  #    and browser MCP tool listings and that the egress proxy refuses LAN addresses.
  stack:
    name: Containers, smoke and end-to-end tests
    if: github.event_name == 'push' || github.head_ref != 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - name: Build sandbox, browser and egress images
        run: |
          podman build -f deploy/container/sandbox.Containerfile -t ghcr.io/robog-two/clarity-sandbox:local .
          podman build -f deploy/container/browser.Containerfile -t ghcr.io/robog-two/clarity-browser:local .
          podman build -f deploy/container/egress.Containerfile -t ghcr.io/robog-two/clarity-egress:local .
      - name: Sandbox smoke test
        run: computers/sandbox/smoke.sh ghcr.io/robog-two/clarity-sandbox:local
      - name: Browser smoke test
        run: computers/browser/smoke.sh ghcr.io/robog-two/clarity-browser:local
      - name: Egress smoke test (with the browser through the proxy)
        run: SMOKE_BROWSER_IMAGE=ghcr.io/robog-two/clarity-browser:local computers/egress/smoke.sh ghcr.io/robog-two/clarity-egress:local
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Podman compose provider
        run: pipx install podman-compose==1.6.0
      - name: End-to-end stack test
        run: e2e/run.sh
