name: Release

# Every push to main publishes, in two jobs:
#  - the container images to ghcr.io (latest, main, sha-<short>; linux/amd64 and arm64), with
#    build provenance attested;
#  - a signed APK as a GitHub Release (v0.1.<run number>).
# (The file keeps its old name so the run number, and with it the APK versionCode, keeps counting.)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  images:
    name: Container images
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # The runtime stages have no RUN steps and the build stage runs on the native platform, so
      # arm64 images do not actually need emulation; QEMU is kept for future RUN steps.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push every image
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"   # registry names must be lowercase
          short="${GITHUB_SHA::7}"
          : > "$RUNNER_TEMP/subjects.txt"
          # service | Containerfile | gradle module | app name | module dir (the last three only for JVM apps)
          while IFS='|' read -r service file module app dir; do
            image="ghcr.io/$owner/clarity-$service"
            echo "::group::$service"
            docker buildx build . --file "$file" --platform linux/amd64,linux/arm64 --push \
              --tag "$image:latest" --tag "$image:main" --tag "$image:sha-$short" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --build-arg MODULE="$module" --build-arg APP_NAME="$app" --build-arg MODULE_DIR="$dir" \
              --build-arg VERSION=latest --build-arg REVISION="$GITHUB_SHA" \
              --cache-from "type=registry,ref=$image:buildcache" \
              --cache-to "type=registry,ref=$image:buildcache,mode=max" \
              --metadata-file "$RUNNER_TEMP/meta.json"
            digest="$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/meta.json")"
            echo "${digest#sha256:}  $image" >> "$RUNNER_TEMP/subjects.txt"
            echo "::endgroup::"
          done <<'LIST'
          backend|deploy/container/jvm-app.Containerfile|backend|clarity-backend|backend
          connector-example|deploy/container/jvm-app.Containerfile|connectors:example|clarity-connector-example|connectors/example
          connector-mail|deploy/container/jvm-app.Containerfile|connectors:mail|clarity-connector-mail|connectors/mail
          connector-dav|deploy/container/jvm-app.Containerfile|connectors:dav|clarity-connector-dav|connectors/dav
          sandbox|deploy/container/sandbox.Containerfile|||
          browser|deploy/container/browser.Containerfile|||
          egress|deploy/container/egress.Containerfile|||
          LIST
          cat "$RUNNER_TEMP/subjects.txt"
      # One attestation covering all images, stored with GitHub; verify with
      # `gh attestation verify oci://ghcr.io/<owner>/clarity-<service>:main --repo <owner>/clarity`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: ${{ runner.temp }}/subjects.txt

  android:
    name: Signed APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # create releases and tags
    timeout-minutes: 45
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6

      - name: Ensure Android platform 37.0
        run: |
          set -eu
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ ! -d "$sdk/platforms/android-37.0" ]; then
            yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$sdk/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"
          fi

      # The keystore exists only as a repository secret; it is written to the runner's temp
      # directory for this job and never uploaded anywhere else.
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -eu
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "CLARITY_SIGNING_STORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: android
        env:
          CLARITY_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CLARITY_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CLARITY_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          ./gradlew assembleRelease --no-daemon --console=plain
          -Pclarity.versionCode="$VERSION_CODE" -Pclarity.versionName="$VERSION_NAME"

      - name: Verify signature and prepare assets
        run: |
          set -eu
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          src=android/app/build/outputs/apk/release/app-release.apk
          out="clarity-$VERSION_NAME.apk"
          "$apksigner" verify --print-certs "$src"
          cp "$src" "$out"
          sha256sum "$out" > "$out.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION_NAME" \
            "clarity-$VERSION_NAME.apk" "clarity-$VERSION_NAME.apk.sha256" \
            --target "$GITHUB_SHA" \
            --title "Clarity $VERSION_NAME" \
            --generate-notes

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
